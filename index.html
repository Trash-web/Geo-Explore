```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Peta Wisata Probolinggo</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f5f7fa;
}

/* HEADER */

.header{
background:linear-gradient(135deg,#0f9b0f,#38ef7d);
padding:20px;
color:white;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.header h1{
font-size:24px;
}

.header p{
font-size:14px;
margin-top:5px;
opacity:.9;
}

/* SEARCH */

.search-box{
padding:15px;
background:white;
position:sticky;
top:0;
z-index:999;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.search-box input{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #ddd;
font-size:14px;
}

/* MAP */

#map{
height:420px;
width:100%;
}

/* CONTENT */

.container{
padding:15px;
}

.info-user{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.info-user h3{
font-size:16px;
color:#333;
}

.card-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
}

/* CARD */

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-body{
padding:15px;
}

.card-title{
font-size:18px;
font-weight:700;
margin-bottom:8px;
color:#222;
}

.card-desc{
font-size:13px;
color:#666;
line-height:1.5;
margin-bottom:10px;
}

.distance{
display:inline-block;
padding:6px 10px;
background:#e8fff0;
color:#0f9b0f;
border-radius:20px;
font-size:12px;
font-weight:700;
margin-bottom:10px;
}

.btn{
display:inline-block;
padding:10px 15px;
border-radius:10px;
text-decoration:none;
font-size:13px;
font-weight:600;
margin-right:5px;
margin-top:5px;
}

.btn-map{
background:#3498db;
color:white;
}

.btn-route{
background:#27ae60;
color:white;
}

.loading{
text-align:center;
padding:30px;
color:#666;
}

.user-marker{
background:#2196F3;
width:20px;
height:20px;
border-radius:50%;
border:3px solid white;
box-shadow:0 0 15px rgba(33,150,243,.8);
}

</style>
</head>

<body>

<div class="header">
<h1>📍 Peta Wisata Probolinggo</h1>
<p>Cari wisata terdekat dari lokasi Anda</p>
</div>

<div class="search-box">
<input type="text"
id="searchInput"
placeholder="Cari wisata...">
</div>

<div id="map"></div>

<div class="container">

<div class="info-user">
<h3 id="statusLokasi">
Menunggu izin lokasi...
</h3>
</div>

<div class="card-grid"
id="cards">

<div class="loading">
Memuat data wisata...
</div>

</div>

</div>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1_WrQNaUU7ls2JyLTlO_DeEwmpw75t_XHd5QpkbxP-J0/gviz/tq?tqx=out:csv";

let wisataData=[];
let filteredData=[];

let userLat=null;
let userLng=null;

let map=
L.map('map')
.setView([-7.75,113.22],10);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

let userMarker;

/* CSV */

function parseCSV(text){

let lines=text.trim().split("\n");

return lines.map(line=>{

let result=[];
let current='';
let inside=false;

for(let char of line){

if(char=='"'){
inside=!inside;
}
else if(char==',' && !inside){
result.push(current);
current='';
}
else{
current+=char;
}

}

result.push(current);

return result;

});

}

/* HAVERSINE */

function distance(lat1,lon1,lat2,lon2){

const R=6371;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;

const c=
2*Math.atan2(Math.sqrt(a),
Math.sqrt(1-a));

return R*c;
}

/* LOCATION */

if(navigator.geolocation){

navigator.geolocation.watchPosition(

position=>{

userLat=position.coords.latitude;
userLng=position.coords.longitude;

document.getElementById(
"statusLokasi"
).innerHTML=
"📍 Lokasi ditemukan";

if(userMarker){
map.removeLayer(userMarker);
}

userMarker=
L.marker([userLat,userLng])
.addTo(map)
.bindPopup("Lokasi Anda");

renderCards(filteredData);

},

err=>{

document.getElementById(
"statusLokasi"
).innerHTML=
"❌ Izin lokasi ditolak";

}

);

}

/* LOAD DATA */

fetch(SHEET_URL)
.then(r=>r.text())
.then(text=>{

let rows=parseCSV(text);

for(let i=1;i<rows.length;i++){

let r=rows[i];

if(r.length<7) continue;

wisataData.push({

id:r[0],
nama:r[1],
alamat:r[2],
lat:parseFloat(r[3]),
lng:parseFloat(r[4]),
deskripsi:r[5],
gambar:r[6],
virtual:r[7]||"#"

});

}

filteredData=[...wisataData];

renderCards(filteredData);

});

/* RENDER */

function renderCards(data){

const cards=
document.getElementById("cards");

cards.innerHTML="";

map.eachLayer(layer=>{

if(layer instanceof L.Marker
&& layer!==userMarker){

map.removeLayer(layer);

}

});

if(userLat){

data.forEach(item=>{

item.jarak=
distance(
userLat,
userLng,
item.lat,
item.lng
);

});

data.sort(
(a,b)=>a.jarak-b.jarak
);

}

let bounds=[];

data.forEach(item=>{

bounds.push([item.lat,item.lng]);

L.marker([
item.lat,
item.lng
])
.addTo(map)
.bindPopup(`
<b>${item.nama}</b><br>
${item.alamat}
`);

cards.innerHTML+=`

<div class="card">

<img src="${item.gambar}"
onerror="this.src='https://picsum.photos/600/400'">

<div class="card-body">

<div class="card-title">
${item.nama}
</div>

<div class="distance">
🚗 ${item.jarak ?
item.jarak.toFixed(1)
:
'-'} KM
</div>

<div class="card-desc">
${item.deskripsi}
</div>

<a
class="btn btn-map"
target="_blank"
href="https://www.google.com/maps?q=${item.lat},${item.lng}">
Lokasi
</a>

<a
class="btn btn-route"
target="_blank"
href="https://www.google.com/maps/dir/${userLat},${userLng}/${item.lat},${item.lng}">
Navigasi
</a>

</div>
</div>

`;

});

if(bounds.length>0){

if(userLat){

bounds.push([userLat,userLng]);

}

map.fitBounds(bounds);

}

}

/* SEARCH */

document
.getElementById("searchInput")
.addEventListener(
"keyup",
function(){

let keyword=
this.value.toLowerCase();

filteredData=
wisataData.filter(item=>

item.nama.toLowerCase()
.includes(keyword)

);

renderCards(filteredData);

});

</script>

</body>
</html>
